<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point Cloud Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── Design tokens ─────────────────────────────────────────────── */
    :root {
      --c-bg:       #E8F4F2;
      --c-surface:  #D5ECE8;
      --c-border:   rgba(0,196,160,.18);
      --c-accent:   #00887A;
      --c-accent-h: #00C4A0;
      --c-text:     #0C2333;
      --c-text-2:   #3A6070;
      --c-text-3:   #6CBDB3;
      --c-card:     #FFFFFF;
      --c-card-b:   rgba(0,136,122,.12);
      --c-tag-bg:   rgba(0,196,160,.12);
      --c-tag-fg:   #00675C;
      --c-danger:   #D94040;
      --shadow:     0 4px 24px rgba(12,35,51,.10);
      --shadow-lg:  0 12px 48px rgba(12,35,51,.16);
      --radius:     12px;
      --radius-sm:  7px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --c-bg:       #070F18;
        --c-surface:  #0C2333;
        --c-border:   rgba(0,196,160,.12);
        --c-accent:   #00C4A0;
        --c-accent-h: #58E5C9;
        --c-text:     #E8F4F2;
        --c-text-2:   #8CC9C2;
        --c-text-3:   #4A8F88;
        --c-card:     #0D2030;
        --c-card-b:   rgba(0,196,160,.10);
        --c-tag-bg:   rgba(0,196,160,.15);
        --c-tag-fg:   #58E5C9;
        --c-danger:   #FF6B6B;
        --shadow:     0 4px 24px rgba(0,0,0,.40);
        --shadow-lg:  0 12px 48px rgba(0,0,0,.60);
      }
    }

    :root[data-theme="dark"] {
      --c-bg:       #070F18;
      --c-surface:  #0C2333;
      --c-border:   rgba(0,196,160,.12);
      --c-accent:   #00C4A0;
      --c-accent-h: #58E5C9;
      --c-text:     #E8F4F2;
      --c-text-2:   #8CC9C2;
      --c-text-3:   #4A8F88;
      --c-card:     #0D2030;
      --c-card-b:   rgba(0,196,160,.10);
      --c-tag-bg:   rgba(0,196,160,.15);
      --c-tag-fg:   #58E5C9;
      --c-danger:   #FF6B6B;
      --shadow:     0 4px 24px rgba(0,0,0,.40);
      --shadow-lg:  0 12px 48px rgba(0,0,0,.60);
    }

    /* ─── Reset & base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      height: 100%;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      line-height: 1.6;
      overflow: hidden;
    }

    /* ─── Landing screen ────────────────────────────────────────────── */
    #landing {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
      background: var(--c-bg);
      transition: opacity .4s ease, visibility .4s ease;
    }

    #landing.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* animated scan grid backdrop */
    #scan-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .8;
      pointer-events: none;
    }

    .landing-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* wordmark */
    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .wordmark-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 800;
      letter-spacing: -.025em;
      color: var(--c-text);
      text-wrap: balance;
      line-height: 1.0;
    }

    .wordmark-title em {
      font-style: normal;
      color: var(--c-accent);
    }

    .wordmark-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem;
      color: var(--c-accent);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-left: 2px;
      align-self: center;
      opacity: .8;
    }

    .tagline {
      font-size: 1rem;
      color: var(--c-text-2);
      font-weight: 300;
      margin-top: -20px;
      letter-spacing: .01em;
    }

    /* input row */
    .url-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .url-input {
      flex: 1;
      min-width: 260px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .875rem;
      background: var(--c-card);
      color: var(--c-text);
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .url-input::placeholder { color: var(--c-text-3); }

    .url-input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(0,196,160,.18);
    }

    .load-btn {
      padding: 14px 28px;
      font-family: 'Syne', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      background: var(--c-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background .2s, transform .1s, opacity .2s;
      white-space: nowrap;
    }

    .load-btn:hover { background: var(--c-accent-h); }
    .load-btn:active { transform: scale(.97); }
    .load-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* drag-and-drop zone */
    .drop-zone {
      border: 1.5px dashed var(--c-border);
      border-radius: var(--radius);
      padding: 22px;
      text-align: center;
      color: var(--c-text-3);
      font-size: .875rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--c-accent);
      background: var(--c-tag-bg);
      color: var(--c-accent);
    }

    .drop-zone-icon {
      width: 22px;
      height: 22px;
      opacity: .7;
      flex-shrink: 0;
    }

    /* hidden real file input */
    #file-input { display: none; }

    /* samples grid */
    .samples-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--c-text-3);
    }

    .samples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .sample-card {
      background: var(--c-card);
      border: 1.5px solid var(--c-card-b);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sample-card:hover {
      border-color: var(--c-accent);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .sample-card-name {
      font-family: 'Syne', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      color: var(--c-text);
    }

    .sample-card-type {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--c-tag-bg);
      color: var(--c-tag-fg);
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      width: fit-content;
    }

    .sample-card-meta {
      font-size: .75rem;
      color: var(--c-text-3);
      margin-top: 2px;
    }

    /* ─── Loading overlay ───────────────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--c-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 300;
      transition: opacity .4s ease, visibility .4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-label {
      font-family: 'Syne', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--c-accent);
    }

    .loading-file {
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      color: var(--c-text-2);
      max-width: 480px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scan-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--c-border);
      border-top-color: var(--c-accent);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Map ───────────────────────────────────────────────────────── */
    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ─── Stats ribbon ──────────────────────────────────────────────── */
    #stats-ribbon {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--c-bg);
      border-top: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0;
      height: 40px;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.22,.68,0,1.2);
      backdrop-filter: blur(12px);
      /* semi-transparent */
      background: color-mix(in srgb, var(--c-bg) 85%, transparent);
    }

    #stats-ribbon.visible {
      transform: translateY(0);
    }

    .ribbon-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 18px;
      height: 100%;
      border-right: 1px solid var(--c-border);
      font-variant-numeric: tabular-nums;
    }

    .ribbon-item:last-child { border-right: none; margin-left: auto; }

    .ribbon-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--c-text-3);
    }

    .ribbon-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      font-weight: 500;
      color: var(--c-text);
    }

    .ribbon-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c-accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .5; transform: scale(.75); }
    }

    .ribbon-back {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      color: var(--c-text-3);
      padding: 0 18px;
      height: 100%;
      transition: color .2s;
    }

    .ribbon-back:hover { color: var(--c-accent); }

    /* ─── Error toast ───────────────────────────────────────────────── */
    #error-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: var(--c-danger);
      color: #fff;
      padding: 12px 22px;
      border-radius: var(--radius-sm);
      font-size: .875rem;
      font-weight: 500;
      z-index: 500;
      max-width: 480px;
      text-align: center;
      transition: transform .35s cubic-bezier(.22,.68,0,1.2);
      box-shadow: var(--shadow-lg);
    }

    #error-toast.visible {
      transform: translateX(-50%) translateY(0);
    }

    /* ─── Streaming progress ────────────────────────────────────────── */
    #stream-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--c-accent);
      z-index: 400;
      width: 0%;
      transition: width .3s ease, opacity .4s ease;
      box-shadow: 0 0 8px var(--c-accent);
    }

    #stream-bar.hidden { opacity: 0; }

    /* ─── Accessibility ─────────────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--c-accent);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 520px) {
      .wordmark-title { font-size: 1.8rem; }
      .samples-grid { grid-template-columns: repeat(2, 1fr); }
      .ribbon-item:not(:first-child):not(:last-child):not(:nth-child(2)) { display: none; }
    }
  </style>
</head>
<body>

  <!-- Animated scan canvas backdrop -->
  <canvas id="scan-canvas" aria-hidden="true"></canvas>

  <!-- ── Landing screen ─────────────────────────────────────────────── -->
  <div id="landing" role="main">
    <div class="landing-inner">

      <div>
        <div class="wordmark">
          <h1 class="wordmark-title">Point<em>Cloud</em></h1>
          <span class="wordmark-sub">Viewer</span>
        </div>
        <p class="tagline">Stream and explore LiDAR data in your browser — LAS, LAZ, COPC, EPT</p>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <form id="url-form" style="display:contents">
          <div class="url-row">
            <input
              type="url"
              id="url-input"
              class="url-input"
              placeholder="https://example.com/pointcloud.copc.laz or ept.json"
              autocomplete="off"
              spellcheck="false"
            >
            <button type="submit" id="load-btn" class="load-btn">Load</button>
          </div>
        </form>

        <label class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="Drop a LAS/LAZ file or click to browse">
          <svg class="drop-zone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.632-8.664 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/>
          </svg>
          <span>Drop a LAS / LAZ / COPC file, or <u>browse</u></span>
          <input type="file" id="file-input" accept=".las,.laz,.copc.laz">
        </label>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <p class="samples-label">Sample datasets</p>
        <div class="samples-grid" id="samples-grid">
          <!-- populated by JS -->
        </div>
      </div>

    </div>
  </div>

  <!-- ── Loading overlay ────────────────────────────────────────────── -->
  <div id="loading-overlay" class="hidden" aria-live="polite" aria-busy="true">
    <div class="scan-ring"></div>
    <p class="loading-label">Loading point cloud</p>
    <p class="loading-file" id="loading-file"></p>
  </div>

  <!-- ── Map container ──────────────────────────────────────────────── -->
  <div id="map"></div>

  <!-- ── Top streaming progress bar ────────────────────────────────── -->
  <div id="stream-bar" class="hidden" role="progressbar" aria-label="Streaming progress"></div>

  <!-- ── Stats ribbon ───────────────────────────────────────────────── -->
  <div id="stats-ribbon" aria-label="Point cloud statistics">
    <div class="ribbon-item">
      <span class="ribbon-dot" title="Live streaming"></span>
      <span class="ribbon-label">File</span>
      <span class="ribbon-value" id="stat-name">—</span>
    </div>
    <div class="ribbon-item">
      <span class="ribbon-label">Points</span>
      <span class="ribbon-value" id="stat-points">—</span>
    </div>
    <div class="ribbon-item">
      <span class="ribbon-label">Format</span>
      <span class="ribbon-value" id="stat-format">—</span>
    </div>
    <div class="ribbon-item">
      <span class="ribbon-label">RGB</span>
      <span class="ribbon-value" id="stat-rgb">—</span>
    </div>
    <div class="ribbon-item">
      <span class="ribbon-label">Class</span>
      <span class="ribbon-value" id="stat-class">—</span>
    </div>
    <button class="ribbon-back" id="ribbon-back" title="Back to start screen" aria-label="Load a different file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
      </svg>
      New file
    </button>
  </div>

  <!-- ── Error toast ────────────────────────────────────────────────── -->
  <div id="error-toast" role="alert" aria-live="assertive"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
